name: Build and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Fetch Stardew Valley references
        run: |
          git clone https://github.com/StardewModders/mod-reference-assemblies.git "$HOME/StardewValley"
          git -C "$HOME/StardewValley" checkout 0141355fecb8536715ecff22f99374b5e632cbed
      - name: Restore
        run: dotnet restore Impactful.sln -p:GamePath="$HOME/StardewValley"
      - name: Build
        run: dotnet build Impactful.sln --no-restore -c Release -p:GamePath="$HOME/StardewValley"
      - name: Test
        run: dotnet test Impactful.sln --no-build -c Release -p:GamePath="$HOME/StardewValley"
      - name: Read project version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          project = Path("Impactful.csproj").read_text()
          version = re.search(r"<Version>([^<]+)</Version>", project).group(1)
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?", version):
              raise SystemExit(f"project version is not a valid release version: {version!r}")

          manifest = json.loads(Path("manifest.json").read_text())
          if manifest.get("Version") != "%ProjectVersion%":
              raise SystemExit("manifest version must use the project version token")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"value={version}\n")
          PY
      - name: Stage package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p package/Impactful/i18n
          cp bin/Release/net6.0/Impactful.dll README.md LICENSE package/Impactful/
          jq --arg version "$VERSION" '.Version = $version' manifest.json > package/Impactful/manifest.json
          cp i18n/default.json package/Impactful/i18n/
          (cd package && zip -r "../Impactful-${VERSION}.zip" Impactful)
      - uses: actions/upload-artifact@v4
        with:
          name: Impactful-${{ steps.version.outputs.value }}
          path: Impactful-${{ steps.version.outputs.value }}.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Check whether version is already released
        id: release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.release.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: Impactful-${{ needs.build.outputs.version }}
      - name: Create tag and GitHub release
        if: steps.release.outputs.exists == 'false'
        run: |
          gh release create "$RELEASE_TAG" \
            "Impactful-${{ needs.build.outputs.version }}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$RELEASE_TAG"
